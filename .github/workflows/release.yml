name: Release

# The release button: Actions → Release → Run workflow. Builds the APK signed with your release
# key from main and publishes it as a GitHub release named after versionName in
# app/build.gradle.kts. Raise versionCode and versionName before each new release.
#
# Keeping the signing key safe:
# - It only ever exists as GitHub secrets. It is written to the runner's temp folder (readable by
#   the runner user only) just for the build step, and deleted right after it.
# - Releases are never signed with a throwaway debug key: missing secrets stop the run, and the
#   finished APK's certificate is checked (and, if the SIGNING_CERT_SHA256 variable is set,
#   must match it exactly).
# - The job that holds the key can only read the repository; the job that can create the
#   release never sees the key.
# - Third-party actions are pinned to exact commits, so a changed tag can't run new code next
#   to the key.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Save as a draft (only you can see it until you publish it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    # Releases come from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Optional extra protection: move the four signing secrets into this environment and limit
    # it to the main branch (Settings → Environments → release). See README > Releases.
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out (with the whisper.cpp submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read the version and check it isn't released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.-]*$ ]] || ! [[ "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Couldn't read versionName and versionCode from app/build.gradle.kts."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::v$VERSION is already released. Raise versionCode and versionName in app/build.gradle.kts, push to main, then run Release again."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing Inkwell $VERSION (version code $CODE)."

      - name: Check the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The signing secrets aren't set. A release is never signed with a throwaway debug key, because it couldn't update the installed app. See README > Signing."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Write the signing key to a private temp file
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inkwell-release.jks"
          echo "INKWELL_KEYSTORE_FILE=$RUNNER_TEMP/inkwell-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          INKWELL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INKWELL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INKWELL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Delete the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/inkwell-release.jks"

      - name: Check the APK is signed with the release key
        id: signature
        env:
          EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          CERTS=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          if grep -q "CN=Android Debug" <<<"$CERTS"; then
            echo "::error::The APK is signed with a debug key, not your release key."
            exit 1
          fi
          DIGEST=$(grep -m1 'certificate SHA-256 digest:' <<<"$CERTS" | awk '{print $NF}')
          if [ -z "$DIGEST" ]; then
            echo "::error::Couldn't read the APK's signing certificate."
            exit 1
          fi
          # keytool prints AB:CD:..., apksigner prints abcd...: compare without colons or case.
          EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$DIGEST" ]; then
            echo "::error::The APK is signed with a different key ($DIGEST) than the SIGNING_CERT_SHA256 variable expects ($EXPECTED)."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Name the APK and write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          DIGEST: ${{ steps.signature.outputs.digest }}
        run: |
          BUILT=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::Built version $BUILT doesn't match $VERSION."
            exit 1
          fi
          NAME="Inkwell-$VERSION"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$NAME.apk"
          (cd dist && sha256sum "$NAME.apk" > "$NAME.apk.sha256")
          SHA=$(cut -d ' ' -f 1 "dist/$NAME.apk.sha256")
          cat > dist/notes.md <<EOF
          Inkwell $VERSION (version code $CODE), built from $GITHUB_SHA.

          Download **$NAME.apk** on your phone and open it. It installs as an update over any
          earlier release, and your notes are kept.

          - APK SHA-256: \`$SHA\`
          - Signing certificate SHA-256: \`$DIGEST\`
          EOF

      - name: Keep the APK for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Can create the release, but never sees the signing key.
    permissions:
      contents: write

    steps:
      - name: Get the APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-apk
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "v$VERSION" dist/*.apk dist/*.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Inkwell $VERSION" \
            --notes-file dist/notes.md \
            "${flags[@]}"
