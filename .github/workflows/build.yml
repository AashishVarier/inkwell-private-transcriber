name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out (with the whisper.cpp submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inkwell-release.jks"
            echo "INKWELL_KEYSTORE_FILE=$RUNNER_TEMP/inkwell-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from GitHub Secrets."
          else
            echo "::warning title=Debug-signed APK::Signing secrets are not set, so this APK is signed with a throwaway debug key. Each such build has a different key, so it can't be installed as an update over a previous build. See README > Signing."
          fi

      - name: Build release APK
        env:
          INKWELL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INKWELL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INKWELL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          NAME="Inkwell-${VERSION}-${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/inkwell-release.jks"
